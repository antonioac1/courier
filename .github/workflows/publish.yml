name: Publish SDKs (PyPI + npm)

# Trusted Publishing (OIDC): no token stored anywhere. Push a tag like sdk-v0.2.1 to publish both SDKs.
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        working-directory: clients/python
        run: |
          PYTHONPATH=src python tests/selftest.py
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist/

  # npm Trusted Publishing (OIDC, no token). Needs the npm side configured once:
  # npmjs.com > getcourier > Settings > Trusted Publisher > GitHub Actions: antonioac1/courier, publish.yml, environment npm.
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm >= 11.5 (required for trusted publishing)
        run: npm install -g npm@latest
      - name: Test and publish
        working-directory: clients/js
        run: |
          node test/selftest.js
          npm publish --provenance --access public
